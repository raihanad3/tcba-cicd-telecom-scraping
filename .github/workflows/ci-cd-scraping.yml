name: CI-CD Web Scraping Telekomunikasi to Azure Blob Storage

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  schedule:
    # Menjalankan pipeline otomatis setiap 6 jam (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci-test-scraping:
    name: CI - Web Scraping & Data Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Web Scraping Pipeline (TLKM, ISAT, EXCL)
        run: |
          python scraper.py --out-dir output

      - name: Run CI Validation Tests
        run: |
          python test_scraper.py --out-dir output

      - name: Preview Scraped Data
        run: |
          echo "=== Scraping Summary JSON ==="
          cat output/scraping_summary.json
          echo "=== Top 8 Rows CSV ==="
          head -n 9 output/telecom_news_scraped.csv

      - name: Upload Scraped Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scraped-telecom-data
          path: output/
          retention-days: 7

  cd-deploy-azure-storage:
    name: CD - Deploy Results to Azure Blob Storage
    needs: ci-test-scraping
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Scraped Artifacts
        uses: actions/download-artifact@v4
        with:
          name: scraped-telecom-data
          path: output

      - name: Azure Login via Microsoft Entra ID (Federated OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload Scraped Data to Azure Blob Storage (Python SDK)
        run: |
          python upload_azure.py \
            --out-dir output \
            --account "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container "${{ vars.AZURE_CONTAINER_NAME }}"

      - name: Sync Latest Data to Bronze Container & Verify Blobs
        run: |
          az storage blob upload \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name bronze \
            --name "telecom_scraping/telecom_news_scraped.csv" \
            --file output/telecom_news_scraped.csv \
            --auth-mode login \
            --overwrite
          echo "=== Daftar Blob pada Container ${{ vars.AZURE_CONTAINER_NAME }} ==="
          az storage blob list \
            --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.AZURE_CONTAINER_NAME }}" \
            --auth-mode login \
            -o table
